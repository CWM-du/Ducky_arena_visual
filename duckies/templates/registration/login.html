{% extends "base.html" %}
{% block title %}Acceder — Ducky Quiz Arenas{% endblock %}
{% block content %}
<section class="auth-card">
    <div class="eyebrow">DUCKY QUIZ ARENAS</div>
    <h1>Entra en tu arena</h1>
    <p class="muted">Accede para gestionar tu Ducky, inventario y equipamiento.</p>
    <form method="post" class="stack-form">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button class="button button-primary" type="submit">Entrar</button>
    </form>
</section>
{% endblock %}
